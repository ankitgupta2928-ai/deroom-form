<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De' Room x Locked-In Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-card-holder {
            width: 100%;
            max-width: 640px; 
            margin: 40px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .form-banner-img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        .iframe-crop-zone {
    width: 100%;
    height: 950px;
    overflow: hidden;
    position: relative;
    margin-top: -5px;
}

        iframe {
            width: 104%;
            height: 100%;
            margin-left: -2%;
            margin-top: 0;
            transform: translateY(10px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="form-card-holder">
        <img src="header.jpg" alt="De' Room Header" class="form-banner-img">
        
        <div class="iframe-crop-zone">
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSeRogy1mvZAhirL7hvcTaGFKgouS0tYtvJWvDwGQFqpv29YrA/viewform?embedded=true"
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">Loading…
            </iframe>
        </div>
    </div>

</body>
</html>
