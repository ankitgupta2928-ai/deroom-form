<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De' Room x Locked-In Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('backhround.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* THE MAIN SHELL: Holds both the banner and the form elements together */
        .form-card-holder {
            width: 100%;
            max-width: 640px; 
            margin: 40px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            overflow: hidden; /* Round corners wrap perfectly around header and form */
            background: #ffffff; /* Sets the backing for the inner form area */
            display: flex;
            flex-direction: column;
        }

        /* 1. NATIVE HEADER BLOCK (Sits completely outside the crop zone) */
        .form-banner-img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        /* 2. THE CROP MASK: Isolates the form content and shaves off the cream edges */
        .iframe-crop-zone {
            width: 100%;
            height: 850px; /* Adjust this value if you need to show more/less form scroll space */
            overflow: hidden;
            position: relative;
        }

        /* The scaling adjustments to expand past Google's cream borders */
        iframe {
            width: 104%;
            height: 105%;
            margin-left: -2%;    /* Cuts off left cream margin */
            margin-top: -55px;   /* Cuts off top maroon bar and top cream padding */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="form-card-holder">
        <img src="header.jpg" alt="De' Room Header" class="form-banner-img">
        
        <div class="iframe-crop-zone">
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSeRogy1mvZAhirL7hvcTaGFKgouS0tYtvJWvDwGQFqpv29YrA/viewform?embedded=true"
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">Loading…
            </iframe>
        </div>
    </div>

</body>
</html>
