<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De' Room x Locked-In Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Using your concrete asset as the fixed background cover */
            background-image: url('image_f4ac1d.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            width: 100%;
            max-width: 660px; 
            margin: 40px 20px;
            box-sizing: border-box;
            
            /* Clean drop shadow to lift the form off the concrete texture */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            overflow: hidden; /* Clean rounded edges on the frame */
        }

        iframe {
            width: 100%;
            /* Increased height to make sure the header + all questions render completely */
            height: 1200px; 
            border: none;
            display: block;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSeRogy1mvZAhirL7hvcTaGFKgouS0tYtvJWvDwGQFqpv29YrA/viewform?embedded=true"
            frameborder="0" 
            marginheight="0" 
            marginwidth="0">Loading…
        </iframe>
    </div>

</body>
</html>
